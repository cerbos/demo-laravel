---
name: "Conventional Commits"
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            chore
            ci
            docs
            enhancement
            feat
            fix
            revert
            test
          requireScope: false
          subjectPattern: "^[A-Z].+$"
          subjectPatternError: |
            Subject "{subject}" does not start with an uppercase letter
          validateSingleCommit: true
